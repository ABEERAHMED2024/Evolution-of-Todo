

services:
  postgres:
    image: postgres:15
    container_name: evolution-of-todo-postgres
    environment:
      POSTGRES_DB: evolution_todo_db
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: