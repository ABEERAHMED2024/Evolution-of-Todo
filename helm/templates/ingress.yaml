apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "evolution-of-todo.fullname" . }}-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: evolution-of-todo.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "evolution-of-todo.fullname" . }}-frontend-svc
            port:
              number: {{ .Values.service.port }}
