apiVersion: v1
kind: Service
metadata:
  name: {{ include "evolution-of-todo.fullname" . }}-backend-svc
  labels:
    {{- include "evolution-of-todo.labels" . | nindent 4 }}
    app: evolution-of-todo-backend
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "evolution-of-todo.selectorLabels" . | nindent 4 }}
    app: evolution-of-todo-backend
