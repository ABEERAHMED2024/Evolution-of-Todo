apiVersion: v1
kind: Service
metadata:
  name: {{ include "evolution-of-todo.frontend.fullname" . }}
  labels:
    {{- include "evolution-of-todo.labels" . | nindent 4 }}
    app: evolution-of-todo-frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "evolution-of-todo.selectorLabels" . | nindent 4 }}
    app: evolution-of-todo-frontend