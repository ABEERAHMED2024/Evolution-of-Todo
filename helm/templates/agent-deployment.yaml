apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "evolution-of-todo.fullname" . }}-agent
  labels:
    {{- include "evolution-of-todo.labels" . | nindent 4 }}
    app: evolution-of-todo-agent
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "evolution-of-todo.selectorLabels" . | nindent 6 }}
      app: evolution-of-todo-agent
  template:
    metadata:
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "agent"
        dapr.io/app-port: "8080"
        dapr.io/config: "dapr-config"
      labels:
        {{- include "evolution-of-todo.selectorLabels" . | nindent 8 }}
        app: evolution-of-todo-agent
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}/agent:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DAPR_HTTP_ENDPOINT
              value: "http://localhost:3500"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-key
                  key: apiKey
          livenessProbe:
            httpGet:
              path: /health
              port: http
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
