# Development environment values
global:
  daprEnabled: true

image:
  repository: evolution-of-todo/dev
  tag: latest

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2

service:
  type: ClusterIP
  port: 80
